management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

resilience4j:
  retry:
    instances:
      inventoryRETRY:
        maxAttempts: 3
        waitDuration: 10s
  ratelimiter:
    instances:
      inventoryRateLimiter:
        limitRefreshPeriod: 5s
        limitForPeriod: 2
        timeoutDuration: 2s
  circuitbreaker:
    instances:
      inventoryCircuitBreaker:
        register-health-indicator: true # Expose circuit breaker health via the actuator
        sliding-window-size: 10  # size of the sliding window for all recording
        failure-rate-threshold: 50  # if 50% (5 out of 10) calls fail,the circuit goes to open state
        wait-duration-in-open-state: 20s  # time the circuit stays open before moving to half_open
        permitted-number-of-calls-in-half-open-state: 5 # number of test calls in half_open_state
        sliding-window-type: COUNT_BASED # use count-based sliding window
        minimum-number-of-calls: 5 # minimum number of calls before calculating failure rate
        automatic-transition-from-open-to-half-open-enabled: true
        event-consumer-buffer-size: 10 # buffer size for event logs


